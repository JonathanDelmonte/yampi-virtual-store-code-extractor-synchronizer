<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="connect-src 'self'"><title>Editor fictício</title><style>body{font:13px system-ui;margin:0;color:#333}header{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #ccc}header a{margin-left:auto}header span.divider{border-left:1px solid #ccc;height:20px}.layout{display:flex}aside{width:250px;flex-shrink:0;border-right:1px solid #ddd;padding:10px;max-height:650px;overflow:auto}.collapse-list{padding-left:8px}.collapse-list>ul{display:none;padding-left:8px}.collapse-list.active>ul{display:block}.folder-title{display:flex;align-items:center;gap:4px;font-weight:600;cursor:pointer;margin:8px 0}.add-item{display:none;margin-left:auto;padding:0 6px;border-radius:4px}.folder-title:hover .add-item{display:block;background:#eee}li{list-style:none;padding:5px;cursor:pointer}.selected{background:#e7f1e5}.tab-item{display:none}.tab-item.active{display:block}.tab-item p{margin:10px}.topbar{padding:10px;display:flex;gap:20px;border-block:1px solid #eee}.topbar button{margin-left:auto}main{min-width:0;flex:1}.cm-editor{height:420px}.cm-scroller{overflow:auto}.tools{padding:12px;background:#fff6dd;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{padding:7px;cursor:pointer}.holder-icon{display:inline-block}.loading{padding:25px}.ds-modal-overlay{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:#212d46b3;opacity:0;visibility:hidden}.ds-modal-overlay--active{opacity:1;visibility:visible}.ds-modal{margin-top:60px;width:420px;background:#fff;border-radius:6px;padding:16px}.ds-modal h3{margin:0 0 12px}.ds-select{position:relative;margin-bottom:10px}.ds-select__trigger{display:flex;justify-content:space-between;border:1px solid #ccc;padding:8px;cursor:pointer}.ds-select__option{padding:6px 8px;cursor:pointer}.ds-input__wrapper{display:flex;border:1px solid #ccc}.ds-input__field{flex:1;border:0;padding:8px}.ds-input__error,.ds-file-uploader__error{color:#9d2402}.ds-file-uploader__zone{border:1px dashed #999;padding:18px;text-align:center}.ds-file-uploader__input{display:block;margin:auto}.button-group{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}</style></head><body>
<header><div><span id="editor-title">Editor de código</span><span class="divider"></span></div><div><span id="shop-name">Loja de testes</span></div><div><input aria-label="Buscar arquivos" placeholder="Buscar arquivos"></div><div><a target="_blank" href="https://loja-exemplo.invalid?preview=true"><span>Ver prévia</span></a><button id="publish">Publicar loja</button></div></header>
<div class="layout"><aside id="tree"></aside><main><div id="tab" class="tab-item active"><p></p><span class="holder-icon"></span></div><div class="topbar"><span id="version">Este arquivo não tem versões salvas</span><button id="save" disabled>Salvar arquivo</button></div><div id="editor"></div></main></div>
<div id="add-file" class="ds-modal-overlay"><div class="ds-modal ds-modal--md"><div class="ds-modal__header"><h3>Adicionar arquivo</h3><button class="ds-modal__close" type="button" aria-label="Fechar"></button></div><div class="ds-modal__body"><form onsubmit="return false"><div class="ds-select"><label class="ds-select__label">Extensão do arquivo</label><div class="ds-select__trigger"><span>SCSS</span><span class="ds-select__arrow"><i></i></span></div><div class="ds-select__dropdown" hidden></div></div><div class="ds-input"><label class="ds-input__label">Nome do arquivo</label><div class="ds-input__wrapper"><input class="ds-input__field" type="text"><div class="ds-input__suffix"><span> .scss</span></div></div></div></form></div><div class="ds-modal__footer"><div class="button-group"><button class="button color-secondary size-lg" type="button">Cancelar</button><button class="button color-primary size-lg" type="button" disabled>Adicionar arquivo</button></div></div></div></div>
<div id="add-asset" class="ds-modal-overlay"><div class="ds-modal ds-modal--md"><div class="ds-modal__header"><h3>Adicionar arquivo</h3><button class="ds-modal__close" type="button" aria-label="Fechar"></button></div><div class="ds-modal__body"><div class="ds-file-uploader"><div class="ds-file-uploader__zone"><input type="file" accept=".png,.jpg,.jpeg,.webp,.svg" class="ds-file-uploader__input"><p class="ds-file-uploader__title">Selecione suas imagens</p></div><p class="ds-file-uploader__helper">Imagens em .png, .jpg, .jpeg, .webp ou .svg até 2MB cada.</p></div></div><div class="ds-modal__footer"><div class="button-group"><button class="button color-secondary size-lg" type="button">Cancelar</button><button class="button color-primary size-lg" type="button" disabled>Adicionar arquivo</button></div></div></div></div>
<div class="tools"><span>Controles de teste:</span><select id="remote-file" aria-label="Arquivo remoto fictício"></select><button id="external-change">Alterar arquivo na loja fictícia</button><button id="switch-shop">Trocar loja fictícia</button><button id="reset">Reiniciar dados fictícios</button><output id="test-info">Publicações: 0</output></div>
<script src="bridge.js"></script><script type="module" src="fixture.js"></script></body></html>
